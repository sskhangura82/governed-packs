name: zz-c2-secret-in-job-env-no-if
on: { push: { branches: ["ci-truth/validator-probe-2"] } }
permissions: { contents: read }
jobs:
  j:
    runs-on: ubuntu-latest
    env:
      FROMSEC: ${{ secrets.NO_SUCH_SECRET != '' }}
    steps:
      - name: no if at all - just render it
        run: echo "C2 rendered FROMSEC='$FROMSEC'"
