# DISPOSABLE FALSIFIER A — CI_TRUTH_RESTORATION_001.
# Reproduces the exact release.yml defect in isolation: `secrets.*` in a
# step-level `if:`. EXPECTED OUTCOME: the Actions validator rejects this file,
# creates ZERO jobs, and records the run as conclusion `failure` -- not as a
# parse error. If this instead creates a job, the diagnosis behind the release.yml
# repair is wrong and the repair must be revisited.
name: zz-probe-A-secrets-in-step-if
on:
  push:
    branches: ["ci-truth/validator-probe-evidence"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: This step gates on a secret directly, which is not allowed here
        if: ${{ secrets.NO_SUCH_SECRET != '' }}
        run: echo "if this line is reachable, the premise of the repair is wrong"
      - name: Always runs
        run: echo "probe A reached its second step"
